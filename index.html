<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap Layout</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      crossorigin="anonymous"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="bg-dark text-white p-3">
      <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
          <a class="navbar-brand" href="#">Мій сайт</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
              <li class="nav-item"><a class="nav-link" href="#">Головна</a></li>
              <li class="nav-item dropdown">
                <a
                  class="nav-link dropdown-toggle"
                  href="#"
                  id="navbarDropdown"
                  role="button"
                  data-bs-toggle="dropdown"
                >
                  Меню
                </a>
                <ul class="dropdown-menu">
                  <li><a class="dropdown-item" href="#">Підпункт 1</a></li>
                  <li><a class="dropdown-item" href="#">Підпункт 2</a></li>
                </ul>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>
    <div class="container mt-4">
      <div class="row">
        <aside class="col-lg-3 col-md-4 d-none d-md-block">
          <div
            id="carouselExample"
            class="carousel slide"
            data-bs-ride="carousel"
          >
            <div class="carousel-inner">
              <div class="carousel-item active">
                <img
                  src="https://media.istockphoto.com/id/2184888945/uk/%D1%84%D0%BE%D1%82%D0%BE/smashed-pink-blush-cosmetics-isolated-on-white-background.jpg?s=1024x1024&w=is&k=20&c=0df-mSuV7HKbobd6eFbCPXpT2WMWnRzNqi4OlvgRNzw="
                  class="d-block w-100"
                  alt="Slide 1"
                />
              </div>
              <div class="carousel-item">
                <img
                  src="https://media.istockphoto.com/id/2080896223/uk/%D1%84%D0%BE%D1%82%D0%BE/closeup-view-of-red-holi-powder.webp?s=1024x1024&w=is&k=20&c=vP_QEPRybUFJQR-Rz3MSdAdpeO8bhBpifd2D3fiDOK4="
                  class="d-block w-100"
                  alt="Slide 2"
                />
              </div>
              <div class="carousel-item">
                <img
                  src="https://media.istockphoto.com/id/968012010/uk/%D1%84%D0%BE%D1%82%D0%BE/%D1%80%D1%96%D0%B7%D0%BD%D0%BE%D0%BA%D0%BE%D0%BB%D1%8C%D0%BE%D1%80%D0%BE%D0%B2%D1%96-%D1%82%D1%96%D0%BD%D1%96-%D0%B4%D0%BB%D1%8F-%D0%BE%D1%87%D0%B5%D0%B9-%D1%96%D0%B7%D0%BE%D0%BB%D1%8C%D0%BE%D0%B2%D0%B0%D0%BD%D1%96-%D0%BD%D0%B0-%D0%B1%D1%96%D0%BB%D0%BE%D0%BC%D1%83-%D1%82%D0%BB%D1%96.webp?s=612x612&w=is&k=20&c=jor2BQrj7J8p8-tEDMoABgDPndcmf7-buQYGjZdcUK0="
                  class="d-block w-100"
                  alt="Slide 3"
                />
              </div>
            </div>
            <button
              class="carousel-control-prev"
              type="button"
              data-bs-target="#carouselExample"
              data-bs-slide="prev"
            >
              <span class="carousel-control-prev-icon"></span>
            </button>
            <button
              class="carousel-control-next"
              type="button"
              data-bs-target="#carouselExample"
              data-bs-slide="next"
            >
              <span class="carousel-control-next-icon"></span>
            </button>
          </div>
        </aside>
        <main class="col-lg-6 col-md-8">
          <h2>Основний контент</h2>
          <div class="accordion" id="accordionExample">
            <div class="accordion-item">
              <h2 class="accordion-header">
                <button
                  class="accordion-button"
                  type="button"
                  data-bs-toggle="collapse"
                  data-bs-target="#collapseOne"
                >
                  Заголовок 1
                </button>
              </h2>
              <div id="collapseOne" class="accordion-collapse collapse show">
                <div class="accordion-body">Текст для першого пункту.</div>
              </div>
            </div>
            <div class="accordion-item">
              <h2 class="accordion-header">
                <button
                  class="accordion-button collapsed"
                  type="button"
                  data-bs-toggle="collapse"
                  data-bs-target="#collapseTwo"
                >
                  Заголовок 2
                </button>
              </h2>
              <div id="collapseTwo" class="accordion-collapse collapse">
                <div class="accordion-body">Текст для другого пункту.</div>
              </div>
            </div>
          </div>
        </main>
        <aside class="col-lg-3 d-none d-lg-block">
          <h2>Форма</h2>
          <form>
            <div class="mb-3">
              <label class="form-label">Ім'я</label>
              <input type="text" class="form-control" />
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" />
            </div>
            <div class="mb-3">
              <label class="form-label">Телефон</label>
              <input type="tel" class="form-control" />
            </div>
            <div class="mb-3">
              <label class="form-label">Адреса</label>
              <input type="text" class="form-control" />
            </div>
            <div class="mb-3">
              <label class="form-label">Повідомлення</label>
              <textarea class="form-control"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Надіслати</button>
          </form>
        </aside>
      </div>
    </div>
    <footer class="bg-dark text-white text-center p-3 mt-4">
      <p>© 2026 Всі права захищені</p>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
